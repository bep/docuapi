baseURL = "https://example.com/"

[module]
    [module.hugoVersion]
        min = "0.161.0"
    [[module.imports]]
        path = "github.com/gohugoio/hugo-mod-alpinejs/alpinejs/v3"
    [[module.imports]]
        path = "github.com/olivernn/lunr.js"
        [[module.imports.mounts]]
            source = "lunr.js"
            target = "assets/js/lib/lunr.js"
