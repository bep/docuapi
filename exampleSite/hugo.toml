locale  = "en-us"
baseurl = "https://docuapi.netlify.app/"
title   = "DocuAPI Example Site"

disableKinds = ["taxonomy"]

defaultContentLanguage = "en"

[markup]
	[markup.goldmark]
		[markup.goldmark.parser]
			autoHeadingIDType = "github-ascii"
		[markup.goldmark.renderer]
			unsafe = true
	# Code highlighting. The theme generates the stylesheet for the
	# configured style with css.ChromaStyles, which requires noClasses = false.
	[markup.highlight]
		codeFences  = true
		guessSyntax = false
		noClasses   = false
		style       = "tokyonight-night"

[module]
	[module.hugoVersion]
	[[module.imports]]
		# This is replaced in go.mod to point to the directory above.
		path = "github.com/bep/docuapi/v3"

[params]
	search       = true
	maxMenuDepth = 3    # (optional) available options are: 1, 2, or 3 (default: 2)

	# Override the theme's CSS variables (design tokens).
	# See assets/css/docuapi/vars.css in the theme for the full list.
	[params.docuapi.cssvars]
		nav-bg      = "#254e70"
		examples-bg = "#002642"
		font-family = '"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
		font-size   = "15px"

	# Configure the language example tabs.
	[[params.language_tabs]]
		key  = "go"
		name = "Go"
	[[params.language_tabs]]
		key  = "shell"
		name = "Shell"
	[[params.language_tabs]]
		key  = "ruby"
		name = "Ruby"
	[[params.language_tabs]]
		key  = "python"
		name = "Python"
	[[params.language_tabs]]
		key  = "javascript"
		name = "Javascript"

#Languages 
[languages]

	[languages.en]
		label  = "English"
		weight = 2
		title  = "DocuAPI Example Site"
		[languages.en.params]
			# Left sidebar footer items. Use HTMl or Markdown.
			toc_footers = [
				"<a href='#'>Sign Up for a Developer Key</a>",
				"Documentation Powered by [DocuAPI](https://github.com/bep/docuapi)",
				"Hugo Theme by [bep](https://github.com/bep)",
			]

	[languages.nn]
		label  = "Nynorsk"
		weight = 1
		title  = "DocuAPI-døme"

		[languages.nn.params]
			# Left sidebar footer items. Use HTMl or Markdown.
			toc_footers = [
				"<a href='#'>Registrer deg for ein utviklarnøkkel</a>",
				"Dokumentasjonen er driven av [DocuAPI](https://github.com/bep/docuapi)",
				"Hugo Theme av [bep](https://github.com/bep)",
			]
